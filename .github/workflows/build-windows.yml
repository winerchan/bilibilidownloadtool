name: Build Windows portable app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install build and runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "pyinstaller>=6,<7" "PyQt5==5.15.11" PyQtWebEngine requests curl_cffi orjson Pillow psutil qrcode cryptography pywin32 browser-cookie3 pycryptodome aiohttp rsa brotli winsdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check source syntax
        run: python -m compileall -q main.py ui.py _pathsetup.py core parsers

      - name: Build executable and assemble portable folder
        shell: python
        run: |
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          app_name = "BilibiliDownloader"
          generated = root / "ci-generated"
          generated.mkdir(exist_ok=True)

          # Some upstream modules use the old top-level name `sip`.
          # Supply that alias using the PyQt5 runtime already bundled below.
          hook = generated / "qt_sip_alias.py"
          hook.write_text(
              "import sys\nfrom PyQt5 import sip\nsys.modules.setdefault('sip', sip)\n",
              encoding="utf-8",
          )

          args = [
              sys.executable, "-m", "PyInstaller", "--noconfirm", "--clean",
              "--onedir", "--windowed", "--noupx", "--name", app_name,
              "--runtime-hook", str(hook), "--hidden-import", "PyQt5.sip",
              "--hidden-import", "winsdk.windows.ui.notifications",
              "--hidden-import", "winsdk.windows.data.xml.dom",
          ]
          for directory in ("core", "core/infra", "parsers"):
              folder = root / directory
              args.extend(["--paths", str(folder)])
              # Upstream imports these files by their short module names.
              for source in sorted(folder.glob("*.py")):
                  if source.stem != "__init__":
                      args.extend(["--hidden-import", source.stem])

          for module in ("PyQt5", "curl_cffi", "Crypto", "qrcode"):
              args.extend(["--collect-all", module])

          for resource in ("assets", "logo.ico", "logo.png", "warning_icon.png", "version_info.json"):
              if (root / resource).exists():
                  destination = resource if (root / resource).is_dir() else "."
                  args.extend(["--add-data", f"{resource}:{destination}"])

          args.append("main.py")
          subprocess.run(args, check=True)

          output = root / "dist" / app_name
          internal = output / "_internal"
          internal.mkdir(exist_ok=True)

          # The application looks for external media tools inside _internal.
          ffmpeg = root / "ffmpeg" / "bin"
          for required in ("ffmpeg.exe", "ffprobe.exe"):
              if not (ffmpeg / required).is_file():
                  raise RuntimeError(f"Repository is missing ffmpeg/bin/{required}")
          shutil.copytree(ffmpeg, internal / "ffmpeg" / "bin", dirs_exist_ok=True)

          bento_candidates = sorted((root / "bento4").rglob("mp4decrypt.exe"))
          if not bento_candidates:
              raise RuntimeError("Repository is missing Bento4 mp4decrypt.exe")
          shutil.copytree(bento_candidates[0].parent, internal / "bento4" / "bin", dirs_exist_ok=True)
          if (root / "mpv").is_dir():
              shutil.copytree(root / "mpv", internal / "mpv", dirs_exist_ok=True)

          executable = output / f"{app_name}.exe"
          if not executable.is_file() or executable.read_bytes()[:2] != b"MZ":
              raise RuntimeError("Build did not produce a Windows executable")
          if not list(internal.rglob("qwindows.dll")):
              raise RuntimeError("Build is missing the Qt Windows platform plugin")

          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          (output / "build-info.txt").write_text(
              f"Repository: {os.environ.get('GITHUB_REPOSITORY', '')}\n"
              f"Commit: {commit}\nPython: {sys.version}\n",
              encoding="utf-8",
          )
          packages = subprocess.check_output([sys.executable, "-m", "pip", "freeze"], text=True)
          (output / "build-dependencies.txt").write_text(packages, encoding="utf-8")
          (output / "READ-ME.txt").write_text(
              "Extract the entire ZIP before running BilibiliDownloader.exe.\n"
              "Keep _internal next to the EXE. Import your Bilibili cookie locally.\n"
              "This is a source build, not the upstream signed installer.\n",
              encoding="utf-8",
          )
          shutil.make_archive(str(root / "BilibiliDownloader-Windows"), "zip", root_dir=output.parent, base_dir=app_name)

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BilibiliDownloader-Windows
          path: BilibiliDownloader-Windows.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build diagnostics if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build/BilibiliDownloader/warn-*.txt
            build/BilibiliDownloader/xref-*.html
          if-no-files-found: ignore
          retention-days: 7
